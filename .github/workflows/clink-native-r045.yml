name: C.Link native 0.4.9 signed release
on:
  push:
    paths:
      - 'native-acceptance/0.4.9/clink-terminal-linux-x64.zip'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: clink-native-acceptance
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'MissSpock-OddFM/phantomtronix.public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Publish exact signed candidate and preserve existing stable clients
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: python3 native-acceptance/0.4.9/publish.py
